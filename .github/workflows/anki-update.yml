# Checks daily for a new Anki release and opens a pull request that moves all
# three variants to it, then starts their builds on the PR branch.
#
# - iOS and native Android: shared/versions.env (ANKI_TAG, ANKI_PY_VERSION)
#   and the pinned dependencies in shared/requirements.txt.
# - Termux: the default versionName. Its build downloads the anki .deb from the
#   krmanik/termux-packages release anki-<ANKI_TAG>; the PR says when that
#   release does not exist yet (run that repository's anki workflow).
#
# The PR description reports what changed in the parts of Anki that Kioku
# replaces at runtime or patches (shared/tools/anki_drift.py).
#
# Waits until Anki's wheels for the release are on PyPI. Builds started from
# here only produce workflow artifacts (no release).
name: Anki update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Anki release tag (empty: latest)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Latest Anki release
        id: anki
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$(gh api repos/ankitects/anki/releases/latest --jq .tag_name)}
          current=$(sed -n 's/^ANKI_TAG=//p' shared/versions.env)
          # PyPI normalises 26.08.1 to 26.8.1
          py=$(uvx --from packaging python -c "from packaging.version import Version; print(Version('$tag'))")
          echo "Anki: latest $tag (PyPI $py), current $current"
          if [ "$tag" = "$current" ]; then
            echo "Up to date."; echo "update=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! curl -fsS -o /dev/null "https://pypi.org/pypi/aqt/$py/json"; then
            echo "aqt $py is not on PyPI yet; trying again tomorrow."
            echo "update=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "update=true"
            echo "tag=$tag"
            echo "py=$py"
            echo "current=$current"
            echo "branch=anki-update/$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Update iOS and Android
        if: steps.anki.outputs.update == 'true'
        env:
          TAG: ${{ steps.anki.outputs.tag }}
          PY: ${{ steps.anki.outputs.py }}
          CURRENT: ${{ steps.anki.outputs.current }}
        run: |
          old_py=$(sed -n 's/^ANKI_PY_VERSION=//p' shared/versions.env)
          sed -i "s/^ANKI_TAG=.*/ANKI_TAG=$TAG/; s/^ANKI_PY_VERSION=.*/ANKI_PY_VERSION=$PY/" shared/versions.env
          sed -i "1s/(aqt\/anki $old_py)/(aqt\/anki $PY)/" shared/requirements.in
          uv pip compile -q -p 3.14 shared/requirements.in -o shared/requirements.txt
          # aqt's and anki's declared dependencies, for the PR description
          {
            echo "### Dependencies declared by aqt/anki $PY"
            echo '```'
            for pkg in aqt anki; do
              curl -fsS "https://pypi.org/pypi/$pkg/$PY/json" \
                | python3 -c "import json,sys; print('\n'.join(json.load(sys.stdin)['info']['requires_dist'] or []))"
            done | grep -v 'extra ==' | sort -u
            echo '```'
          } > "$RUNNER_TEMP/deps.md"

      - name: What changed that Kioku depends on
        if: steps.anki.outputs.update == 'true'
        id: drift
        env:
          TAG: ${{ steps.anki.outputs.tag }}
          CURRENT: ${{ steps.anki.outputs.current }}
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/ankitects/anki "$RUNNER_TEMP/anki"
          git -C "$RUNNER_TEMP/anki" fetch -q origin tag "$CURRENT" tag "$TAG"
          if python3 -I shared/tools/anki_drift.py "$RUNNER_TEMP/anki" "$CURRENT" "$TAG" > "$RUNNER_TEMP/drift.md"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Termux
        if: steps.anki.outputs.update == 'true'
        id: termux
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.anki.outputs.tag }}
          CURRENT: ${{ steps.anki.outputs.current }}
        run: |
          sed -i "s/anki$CURRENT'/anki$TAG'/" termux/app/build.gradle
          if gh release view "anki-$TAG" -R krmanik/termux-packages >/dev/null 2>&1; then
            echo "deb=found" >> "$GITHUB_OUTPUT"
          else
            echo "deb=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull request
        if: steps.anki.outputs.update == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.anki.outputs.branch }}
          commit-message: "Update Anki to ${{ steps.anki.outputs.tag }}"
          title: "Update Anki to ${{ steps.anki.outputs.tag }}"
          body-path: ${{ runner.temp }}/deps.md
          labels: anki-update

      - name: Pull request description
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.anki.outputs.tag }}
          CURRENT: ${{ steps.anki.outputs.current }}
          DEB: ${{ steps.termux.outputs.deb }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          DRIFT_CLEAN: ${{ steps.drift.outputs.clean }}
        run: |
          if [ "$DEB" = found ]; then
            termux="- [x] Termux: release [anki-$TAG](https://github.com/krmanik/termux-packages/releases/tag/anki-$TAG) exists"
          else
            termux="- [ ] Termux: run the [anki workflow](https://github.com/krmanik/termux-packages/actions/workflows/anki.yml) of krmanik/termux-packages for $TAG, then rerun the Termux APK build"
          fi
          {
            echo "Anki [$TAG](https://github.com/ankitects/anki/releases/tag/$TAG) is out (was $CURRENT)."
            echo
            echo "- [x] iOS and native Android: \`shared/versions.env\`, \`shared/requirements.txt\`"
            echo "$termux"
            echo "- [ ] Builds: Android APK, iOS IPA and Termux APK were started on this branch (Actions tab)"
            echo "- [ ] Compare the dependencies below with \`shared/requirements.in\` and \`termux/tools/python-requirements.in\`"
            if [ "$DRIFT_CLEAN" = true ]; then
              echo "- [x] Nothing Kioku replaces in Anki changed, and the Rust patches apply (report below)"
            else
              echo "- [ ] Check the changed functions or failing patches in the report below (see shared/patches/README.md)"
            fi
            echo "- [ ] Run the tests in docs/testing.md on a phone"
            echo
            cat "$RUNNER_TEMP/deps.md"
            echo
            cat "$RUNNER_TEMP/drift.md"
          } > "$RUNNER_TEMP/body.md"
          gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"

      - name: Build all variants on the branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.anki.outputs.branch }}
          DEB: ${{ steps.termux.outputs.deb }}
        run: |
          # pull requests opened with GITHUB_TOKEN start no workflows by
          # themselves; dispatching them explicitly is allowed. The Termux
          # build can only fail until krmanik/termux-packages has the deb.
          workflows="android.yml ios.yml"
          [ "$DEB" = found ] && workflows="$workflows termux.yml"
          for workflow in $workflows; do
            gh workflow run "$workflow" --ref "$BRANCH"
          done
