# Builds the Termux variant (termux/: Termux runtime + X11 desktop) and
# publishes it to a GitHub release.
#
# - Push a tag like v0.2.0: release.yml runs this and attaches
#   Kioku-Termux-0.2.0-arm64.apk to the draft release of that tag.
# - Run it by hand (Actions → Termux APK → Run workflow): builds and keeps the
#   APK as a workflow artifact; give a tag to attach it to that
#   release too (the release must exist).
# - Push to main changing termux/ or shared/versions.env: builds only.
#
# Signing: add these repository secrets to sign with your own key. Keep the same
# key for every release, or Android refuses to update an installed Kioku.
#   KIOKU_KEYSTORE_BASE64    base64 of the .jks file (base64 -w0 kioku.jks)
#   KIOKU_KEYSTORE_PASSWORD  store password
#   KIOKU_KEY_ALIAS          key alias
#   KIOKU_KEY_PASSWORD       key password (if different from the store password)
# Without them the APK is signed with a throwaway debug key.
name: Termux APK

on:
  push:
    # build only (no release) when the termux code or the Anki version changes on main
    branches: [main]
    paths: ["termux/**", "shared/versions.env", "shared/python/kioku/**", ".github/workflows/termux.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (empty: build only)"
        required: false
        default: ""
  # release.yml: builds for the draft release of a tag
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: termux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      NDK_VERSION: "30.0.14904198"
      # tools/build_bootstrap.sh defaults to macOS's bundle path.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    defaults:
      run:
        working-directory: termux
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: termux-x11 sources (kioku branch of krmanik/termux-x11)
        run: |
          git submodule update --init third_party/termux-x11
          git -C third_party/termux-x11 submodule update --init --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs "tools", which current sdkmanager no longer has.
          packages: platform-tools

      - name: Android SDK platform, NDK and CMake
        run: |
          # NDK 30.0.14904198 is a release candidate: only in the beta channel (--channel=1).
          sdkmanager --channel=1 --install "platforms;android-36" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
          test -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Termux packages
        uses: actions/cache@v4
        with:
          path: termux/build/debs
          key: termux-debs-${{ hashFiles('termux/tools/build_bootstrap.sh', 'termux/tools/fetch_debs.py') }}-${{ github.run_id }}
          restore-keys: termux-debs-${{ hashFiles('termux/tools/build_bootstrap.sh', 'termux/tools/fetch_debs.py') }}-

      - name: Build the runtime (bootstrap-aarch64.zip)
        env:
          # tools/fetch_anki_debs.py: the anki release of krmanik/termux-packages
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/build_bootstrap.sh

      - name: Version
        id: version
        env:
          tag: ${{ inputs.tag }}
        run: |
          if [ -n "$tag" ]; then version="${tag#v}"; else version="0.0.0-${GITHUB_SHA::7}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KIOKU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KIOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KIOKU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KIOKU_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KIOKU_KEYSTORE_BASE64 secret; the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kioku.jks"
          {
            echo "KIOKU_KEYSTORE=$RUNNER_TEMP/kioku.jks"
            echo "KIOKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KIOKU_KEY_ALIAS=$KEY_ALIAS"
            echo "KIOKU_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PkiokuVersionName="${{ steps.version.outputs.version }}" \
            -PkiokuVersionCode="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          apk="dist/Kioku-Termux-${{ steps.version.outputs.version }}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS-termux.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Kioku-Termux-${{ steps.version.outputs.version }}
          path: termux/dist/
          compression-level: 0

      - name: Attach to the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" dist/*.apk dist/SHA256SUMS-termux.txt --clobber -R "$GITHUB_REPOSITORY"
